apiVersion: batch/v1
kind: Job
metadata:
  name: job-04-names
  namespace: dev
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: processor
        image: ghcr.io/torsteinelv/speech-dataset-builder:latest
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args: ["python src/name_extractor.py && python src/name_aggregator.py"]
        env:
        # Samme S3-variabler...
        - name: AWS_ACCESS_KEY_ID
          valueFrom: { secretKeyRef: { name: speech-dataset-secrets, key: AWS_ACCESS_KEY_ID } }
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: { secretKeyRef: { name: speech-dataset-secrets, key: AWS_SECRET_ACCESS_KEY } }
        - name: S3_ENDPOINT_URL
          valueFrom: { secretKeyRef: { name: speech-dataset-secrets, key: S3_ENDPOINT_URL } }
        - name: S3_BUCKET
          valueFrom: { secretKeyRef: { name: speech-dataset-secrets, key: S3_BUCKET } }
        - name: S3_BASE_PATH
          value: "002_speech_dataset"
          
        # LLM Variabler
        - name: LLM_BASE_URL
          value: "https://vllm-api.thorsland.no" 
        - name: LLM_API_KEY
          valueFrom: { secretKeyRef: { name: speech-dataset-secrets, key: OPENAI_API_KEY } }
        - name: LLM_MODEL
          valueFrom: { secretKeyRef: { name: speech-dataset-secrets, key: LLM_MODEL } }

        resources:
          limits:
            memory: "4Gi"
            cpu: "2"
